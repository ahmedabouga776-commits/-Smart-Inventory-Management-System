apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: omr21/auth-service:latest
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: MONGO_URI
              value: mongodb://mongo:27017/auth_db
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: smart-inventory-secrets
                  key: ADMIN_NAME
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: smart-inventory-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-inventory-secrets
                  key: ADMIN_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-inventory-secrets
                  key: JWT_SECRET

