apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: omr21/notification-service:latest
          ports:
            - containerPort: 4005
          env:
            - name: PORT
              value: "4005"
            - name: MONGO_URI
              value: mongodb://mongo:27017/notification_db
            - name: RABBITMQ_URL
              value: amqp://rabbitmq:5672
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 4005
      targetPort: 4005
