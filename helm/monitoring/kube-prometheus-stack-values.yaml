# ─────────────────────────────────────────────────────────────────────────────
# Smart Inventory – kube-prometheus-stack values (simplified)
# Install / upgrade:
#   helm upgrade --install kube-prometheus prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace \
#     -f helm/monitoring/kube-prometheus-stack-values.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  adminPassword: changeme

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      serve_from_sub_path: true

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
    hosts:
      - ""
    path: /grafana/?(.*)
    pathType: ImplementationSpecific

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"

  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

      kubernetes-cluster:
        gnetId: 315
        revision: 3
        datasource: Prometheus

  defaultDashboardsEnabled: false

  service:
    type: NodePort
    nodePort: 30300

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 7d
    scrapeInterval: 30s
    evaluationInterval: 30s

    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}

    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

# ── Alertmanager – Discord + Slack notifications ──────────────────────────────
alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: discord-warning

      routes:
        - matchers:
            - severity = critical
          receiver: discord-critical

    receivers:

      # Warning Alerts
      - name: discord-warning

        discord_configs:
          - webhook_url: "https://discord.com/api/webhooks/1523387878535729194/kXCPTQSsHz4p49AhaSSbTMANDb5roxjD8j28R5hQL4XSCjRwtk659fz_WwpvHTiSTTbt"
            title: "⚠️ [WARNING] {{ .GroupLabels.alertname }}"
            message: |
              {{ range .Alerts }}
              **{{ .Annotations.summary }}**
              {{ .Annotations.description }}
              {{ end }}

        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            send_resolved: true
            title: "⚠️ [WARNING] {{ .GroupLabels.alertname }}"
            text: |
              {{ range .Alerts }}
              *{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}

      # Critical Alerts
      - name: discord-critical

        discord_configs:
          - webhook_url: "https://discord.com/api/webhooks/1523387878535729194/kXCPTQSsHz4p49AhaSSbTMANDb5roxjD8j28R5hQL4XSCjRwtk659fz_WwpvHTiSTTbt"
            title: "🚨 [CRITICAL] {{ .GroupLabels.alertname }}"
            message: |
              @here

              {{ range .Alerts }}
              **{{ .Annotations.summary }}**
              {{ .Annotations.description }}
              {{ end }}

        slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            send_resolved: true
            title: "🚨 [CRITICAL] {{ .GroupLabels.alertname }}"
            text: |
              <!here>

              {{ range .Alerts }}
              *{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}

# ── Default rules ─────────────────────────────────────────────────────────────
defaultRules:
  create: false

# ── Infrastructure Components ─────────────────────────────────────────────────
kube-state-metrics:
  enabled: true

nodeExporter:
  enabled: true

prometheusOperator:
  enabled: true

# ── Disable unreachable control-plane monitors (Kind only) ───────────────────
kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false